[agent]
; Odoo serverinin ünvanı (Etiket çapı -> Ayarlar -> Server ünvanı)
server_url = http://192.168.1.10:8069
; Etiket çapı -> Ayarlar -> Agent tokeni
token = BURAYA_TOKEN
; Odoo bazasının adı
database = AtomicTest
; Odoo-dakı "Printer açarı" -> bu kompüterdəki printer adı (Windows-da göründüyü kimi
; və ya şəbəkə printeri üçün tcp://IP:9100).
; Çek printeri (ESC/POS, məs. XP-80C) üçün adın qabağına "escpos:" yazın —
; agent TSPL bitmap-ı ESC/POS rasterə çevirir.
printer_map = {"default": "Xprinter XP-410B", "kassa": "escpos:XP-80C"}
; neçə saniyədə bir növbəni yoxlasın
poll_interval = 3
